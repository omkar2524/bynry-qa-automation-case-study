name: QA Automation Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  qa-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run API tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          COMPANY1_TOKEN: ${{ secrets.COMPANY1_TOKEN }}
          COMPANY1_EMAIL: ${{ secrets.COMPANY1_EMAIL }}
          COMPANY1_PASSWORD: ${{ secrets.COMPANY1_PASSWORD }}
        run: |
          pytest tests/api -m api -v

      - name: Run UI tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          COMPANY1_EMAIL: ${{ secrets.COMPANY1_EMAIL }}
          COMPANY1_PASSWORD: ${{ secrets.COMPANY1_PASSWORD }}
        run: |
          pytest tests/ui -m "not mobile" -v

      - name: Run integration tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          COMPANY1_TOKEN: ${{ secrets.COMPANY1_TOKEN }}
          COMPANY1_EMAIL: ${{ secrets.COMPANY1_EMAIL }}
          COMPANY1_PASSWORD: ${{ secrets.COMPANY1_PASSWORD }}
          COMPANY2_EMAIL: ${{ secrets.COMPANY2_EMAIL }}
          COMPANY2_PASSWORD: ${{ secrets.COMPANY2_PASSWORD }}
        run: |
          pytest tests/integration -m integration -v

      - name: Generate test report
        if: always()
        run: |
          pytest --html=reports/test-report.html --self-contained-html || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: reports/test-report.html
